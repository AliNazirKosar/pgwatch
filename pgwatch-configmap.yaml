# ConfigMap: almacena configuración no sensible en texto plano
# A diferencia del Secret, los valores NO van en base64
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgwatch-config    # nombre con el que el Deployment referenciará este ConfigMap
  namespace: development
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/pgwatcher"