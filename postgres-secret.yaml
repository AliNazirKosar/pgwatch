# Secret: almacena credenciales de PostgreSQL en base64
# Kubernetes usa este objeto para no poner contraseñas en texto plano en otros archivos
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret    # nombre con el que otros recursos harán referencia a este Secret
  namespace: development       # namespace donde vive (el mismo que tus otros recursos)
type: Opaque               # tipo genérico para credenciales arbitrarias
data:
  # Los valores están en base64 (no es cifrado, es solo codificación)
  # Para decodificar: [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("cGd3YXRjaA=="))
  POSTGRES_USER: cG9zdGdyZXM=        # "pgwatch"
  POSTGRES_PASSWORD: cG9zdGdyZXM= # "pgwatch123"
  POSTGRES_DB: cGd3YXRjaGVy          # "pgwatchdb"
  ENCRYPT_KEY: MzdGYU1kNlhBUTQ1LWpvR1NZZUhOcVpSbnlkbXBQNFFkYTZhVDRYNXpXRT0=