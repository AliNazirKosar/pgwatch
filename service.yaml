# Tipo de objeto Kubernetes — un Service expone el contenedor al exterior
apiVersion: v1
kind: Service
metadata:
  # Nombre del service
  name: pgwatch-service
  namespace: development
spec:
  selector:
    app: pgwatch
  # NodePort — abre un puerto fijo en el nodo, funciona en cualquier namespace
  # LoadBalancer solo funciona en el namespace default con Docker Desktop
  type: NodePort
  ports:
    - port: 8000          # puerto interno del cluster
      targetPort: 8000    # puerto del contenedor
      nodePort: 30000     # puerto accesible desde fuera (rango 30000-32767)